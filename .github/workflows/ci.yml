name: CI

"on":
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (CPU, no model assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Missing tracker dependencies must fail, never install during test imports.
      YOLO_AUTOINSTALL: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-anpr.txt
            requirements.txt
            services/api/requirements.txt
      - name: Install media system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - name: Install CPU PyTorch and recorded project dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0 torchvision==0.28.0
          python -m pip install \
            -r requirements-anpr.txt -r requirements.txt -r services/api/requirements.txt \
            streamlit==1.62.0 pandas==3.0.5 PyYAML==6.0.3 Pillow==12.3.0 \
            httpx==0.28.1 python-multipart==0.0.32 greenlet==3.5.5 asyncpg==0.31.0 \
            lap==0.5.13
          python -m pip check
      - name: Run full Python suite and show asset skip reasons
        run: python -m pytest -q -rs -o asyncio_mode=auto tests/ services/api/tests/

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

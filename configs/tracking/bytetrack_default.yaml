# Pinned ByteTrack Configuration for RoadSense India Pothole Association
schema_version: 1
tracker_type: bytetrack

# Association Thresholds
track_high_thresh: 0.25      # High confidence threshold for first association pass
track_low_thresh: 0.10       # Low confidence threshold for secondary association pass
new_track_thresh: 0.30       # Minimum confidence to initialize a new track candidate
track_buffer: 30             # Number of frames to keep a lost track alive before termination
match_thresh: 0.80           # IoU matching threshold for Kalman filter gating
fps: 30                      # Standard base frame rate assumption
min_hits: 2                  # Minimum consecutive frame hits to qualify as a stable track
